<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/flashcards.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">Quiz<span class="brand-mark">Hub</span></a>
    <span class="topbar-sub" id="fc-subtitle"></span>
  </div>
</div>

<div class="wrap">
  <div class="crumb"><a href="index.html">&larr; All classes</a></div>
  <div id="loading" class="loading">Loading flashcards&hellip;</div>
  <div id="app" hidden>
    <p class="fc-links" id="fc-links"></p>
    <div class="fc-chips" id="fc-chips" role="group" aria-label="Choose a deck"></div>
    <div class="fc-meta"><span id="fc-pos"></span><span id="fc-known"></span></div>
    <div class="fc-bar"><i id="fc-fill"></i></div>
    <button class="fc-card" id="fc-card" aria-label="Flashcard. Press to flip."></button>
    <div class="fc-ctrls">
      <button class="fc-btn" id="fc-prev">Previous</button>
      <button class="fc-btn fc-known-btn" id="fc-mark" aria-pressed="false">Got it</button>
      <button class="fc-btn" id="fc-shuf">Shuffle</button>
      <button class="fc-btn fc-primary" id="fc-next">Next</button>
    </div>
    <p class="fc-keys">Keys: Space flips, arrow keys move, K marks as known.</p>
  </div>
</div>

<footer class="site">Built for sharing study quizzes with classmates.</footer>

<script src="assets/flashcards.js"></script>
</body>
</html>
