<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Quizzes</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">Quiz<span class="brand-mark">Hub</span></a>
    <span class="topbar-sub">study quizzes by class</span>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <h1>Pick a class</h1>
    <p>Open a class to see its quizzes.</p>
  </div>

  <section id="featured" class="featured" hidden aria-labelledby="featured-title">
    <div class="featured-head">
      <span class="featured-flag">Updated</span>
      <h2 id="featured-title">Final exam reviews</h2>
    </div>
    <p class="featured-sub">New review quizzes built from the final study materials. Start here.</p>
    <div id="featured-list" class="featured-list"></div>
  </section>

  <h2 class="list-title">All classes</h2>
  <div id="class-list" class="class-list"></div>
  <div id="empty" class="empty-state" hidden>No classes yet. Add one in <code>classes.json</code>.</div>
</div>

<footer class="site">Built for sharing study quizzes.</footer>

<script src="assets/app.js"></script>
</body>
</html>
